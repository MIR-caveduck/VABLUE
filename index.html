<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VABLUE MEMORY ARCHIVE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>

  <main id="app">
    <section class="archive-screen screen active" id="archiveScreen">
      <div class="archive-header">
        <div class="archive-kicker">VABLUE</div>
        <h1>MEMORY ARCHIVE</h1>
        <p>우리가 남긴 장면들.</p>
      </div>

      <div class="shelf-wrap">
        <div class="shelf-label">MEMBER ALBUMS</div>
        <div class="album-grid" id="albumGrid"></div>
        <div class="wood-shelf"></div>
      </div>

      <div class="archive-footer">
        <span class="status-dot"></span>
        <span>현재 열람 가능한 앨범: <b id="openCount">1</b> / 6</span>
      </div>
    </section>

    <section class="member-screen screen" id="memberScreen">
      <button class="back-btn" id="backBtn" type="button">← Archive</button>

      <div class="member-hero">
        <div class="book-open">
          <div class="page page-left">
            <div class="page-kicker">MEMORY ALBUM</div>
            <h2 id="memberName">RUCHEL</h2>
            <div class="member-line"></div>
            <p id="memberMeta">2025.09.07 —</p>
            <div class="member-quote">“기억하고 싶은 장면들을 한 권에.”</div>
          </div>
          <div class="page page-right">
            <div class="portrait-placeholder">
              <div class="portrait-mark">R</div>
              <span>RUCHEL ARCHIVE</span>
            </div>
          </div>
        </div>
      </div>

      <section class="category-section">
        <div class="section-head">
          <div>
            <span>CHAPTERS</span>
            <h3>카테고리</h3>
          </div>
          <p>앨범의 북마크를 골라보세요.</p>
        </div>
        <div class="category-grid" id="categoryGrid"></div>
      </section>

      <section class="gallery-section" id="gallerySection">
        <div class="gallery-head">
          <div>
            <span id="galleryKicker">ANNIVERSARY</span>
            <h3 id="galleryTitle">1주년</h3>
          </div>
          <div class="gallery-count" id="galleryCount">0 memories</div>
        </div>
        <div class="photo-grid" id="photoGrid"></div>
      </section>
    </section>
  </main>

  <div class="toast" id="toast">아직 준비 중인 앨범입니다.</div>
  <script src="app.js"></script>
</body>
</html>
